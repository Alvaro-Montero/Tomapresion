name: EAS Build APK
on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build:
    name: EAS build (Android APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Write google-services.json (from secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Writing google-services.json from secret"
            echo "$GOOGLE_SERVICES_JSON" > google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON secret provided"
          fi

      - name: EAS login check
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          if [ -n "$EAS_TOKEN" ]; then
            eas whoami || true
            echo "EAS token present"
          else
            echo "EAS_TOKEN secret not set"
            exit 1
          fi

      - name: Run EAS build (Android APK)
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
        run: |
          eas build -p android --profile preview --non-interactive --json > eas-output.json
          cat eas-output.json

      - name: Upload EAS output artifact
        uses: actions/upload-artifact@v4
        with:
          name: eas-output
          path: eas-output.json
